# nav_node configured for flight sensing -- the estimator half of
# pat_simulation/config/sensors_flight.yaml. Every noise figure and latency
# below is that profile's, so the filter is told the truth about its sensors.
# Use with nav_params:=<this file> (and sensor_profile:=sensors_flight.yaml on
# the simulation). Every option is written out; see nav.yaml for what each means.
pat_nav:
  ros__parameters:
    navigator: "imu_ekf"

    # --- Thread and output ---------------------------------------------------
    nav_hz:       500.0              # one wake per IMU sample
    publish_hz:   100.0
    output_topic: "/chaser/nav/odom"
    imu_hz:       500.0              # sensors_flight.yaml's imu_rate_hz

    # --- Realtime ------------------------------------------------------------
    rt_priority_nav: 0
    lock_memory:     false
    # rt_cpus_nav: [2, 3]

    # --- imu_ekf: noise model (sensors_flight.yaml's imu_* channels) ----------
    imu_ekf.gyro_noise_std:  0.002   # imu_gyro_z.noise_std
    imu_ekf.accel_noise_std: 0.02    # imu_accel_*.noise_std
    imu_ekf.gyro_bias_walk:  0.00005 # imu_gyro_z.bias_walk_std
    imu_ekf.accel_bias_walk: 0.0005  # imu_accel_*.bias_walk_std

    imu_ekf.yaw_meas_std: 0.0005     # star_yaw.noise_std
    imu_ekf.pos_meas_std: 0.005      # nav_*.noise_std
    imu_ekf.vel_meas_std: 0.01

    # Priors wide enough to contain the profile's constant biases (gyro 0.003,
    # accel 0.02 / -0.015) at well under 1 sigma.
    imu_ekf.init_pos_std:        0.01
    imu_ekf.init_yaw_std:        0.01
    imu_ekf.init_vel_std:        0.05
    imu_ekf.init_gyro_bias_std:  0.01
    imu_ekf.init_accel_bias_std: 0.05

    # --- imu_ekf: sensor latency (sensors_flight.yaml's delay_s) --------------
    imu_ekf.latency_yaw: 0.1         # star_yaw.delay_s
    imu_ekf.latency_pos: 0.2         # nav_*.delay_s
    imu_ekf.latency_vel: 0.0
    imu_ekf.use_twist: false
    # Essential with this profile: the 2 Hz position fix and 5 Hz star tracker
    # ride on 100 Hz odometry, so each reading is republished many times.
    imu_ekf.skip_repeated: true
    imu_ekf.use_position: true

    # --- imu_ekf: robustness and realtime bound ------------------------------
    # 0.2 s at 500 Hz is 100 steps; 256 leaves room. Replay cost is timed at
    # startup against half of 1/nav_hz.
    imu_ekf.history_len: 256
    imu_ekf.max_imu_gap: 0.1
    imu_ekf.gate_yaw: 10.83
    imu_ekf.gate_pos: 13.82
    imu_ekf.gate_vel: 13.82
