pat_gnc:
  ros__parameters:
    navigator:     "direct"    # Options: direct (MVP), ekf (Phase 2)
    controller:    "pid"       # Options: pid (MVP), lqr (Phase 2), mpc (Phase 3)
    control_hz:    10.0
    navigation_hz: 50.0        # EKF predict rate (ignored in direct mode)
    hold_offset_x: 0.30        # Target-frame hold point (m)
    hold_offset_y: 0.0
    pid:
      kp:    [1.2,  1.2,  0.8]
      ki:    [0.05, 0.05, 0.02]
      kd:    [0.4,  0.4,  0.2]
      u_max: [5.0,  5.0,  2.0]
