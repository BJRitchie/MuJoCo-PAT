# Flight-representative sensing: an overlay on simulation.yaml.
#
# Loaded AFTER simulation.yaml (sensor_profile:=<this file> on
# simulation.launch.py / full_stack_nmpc.launch.py), so it overrides only what
# it names; every other channel stays as simulation.yaml sets it. Each channel
# it touches is written out in full.
#
# What flight has instead of mocap: a fast IMU with bias, a slow and late star
# tracker for absolute attitude, and a slow, late relative-navigation position
# fix. pat_gnc's nav_node fuses these; its
# matching configuration is pat_gnc/config/nav_flight.yaml.
#
# The figures are representative of a tactical-grade MEMS IMU and a small star
# tracker -- chosen to exercise every part of the estimator, not taken from a
# particular datasheet.
pat_simulation:
  ros__parameters:
    # The IMU at the physics rate. Odometry and joint states stay at
    # pub_rate_hz, which the arm NMPC's control_hz is matched to.
    imu_rate_hz: 500.0

    # Truth for scoring the estimate (/sim_only/ground_truth carries the
    # chaser's true pose and velocity).
    publish_ground_truth: true

    sensors:
      # IMU -- per-sample sigmas at 500 Hz; biases constant plus a slow walk.
      imu_accel_x:  {scale_error: 0.0, bias:  0.02,  bias_walk_std: 0.0005, noise_std: 0.02,   quantisation: 0.0, rate_hz: 0.0, dropout_prob: 0.0,  delay_s: 0.0}
      imu_accel_y:  {scale_error: 0.0, bias: -0.015, bias_walk_std: 0.0005, noise_std: 0.02,   quantisation: 0.0, rate_hz: 0.0, dropout_prob: 0.0,  delay_s: 0.0}
      imu_gyro_z:   {scale_error: 0.0, bias:  0.003, bias_walk_std: 0.00005, noise_std: 0.002, quantisation: 0.0, rate_hz: 0.0, dropout_prob: 0.0,  delay_s: 0.0}
      # Relative-navigation position: 2 Hz, 5 mm, 200 ms late.
      # No dropout: the sensor model drops each channel independently, so a
      # dropout here would produce fixes with one fresh coordinate and one
      # held from the previous sample -- something a real sensor, which loses
      # the whole fix, never emits, and which the estimator would fuse as new.
      nav_x:        {scale_error: 0.0, bias:  0.0,   bias_walk_std: 0.0,    noise_std: 0.005,  quantisation: 0.0, rate_hz: 2.0, dropout_prob: 0.0,  delay_s: 0.2}
      nav_y:        {scale_error: 0.0, bias:  0.0,   bias_walk_std: 0.0,    noise_std: 0.005,  quantisation: 0.0, rate_hz: 2.0, dropout_prob: 0.0,  delay_s: 0.2}
      # Star tracker: 5 Hz, 0.5 mrad (~100 arcsec), 100 ms late.
      star_yaw:     {scale_error: 0.0, bias:  0.0,   bias_walk_std: 0.0,    noise_std: 0.0005, quantisation: 0.0, rate_hz: 5.0, dropout_prob: 0.0,  delay_s: 0.1}
