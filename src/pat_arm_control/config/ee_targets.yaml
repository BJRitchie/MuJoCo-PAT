# ee_target_publisher — a fixed loop of known-reachable EE setpoints per arm.
#
# mode: relative  → waypoints are planar offsets (dx, dy, dyaw) added to the
#                   arm's measured start pose (from /chaser/arm/<side>/ee_pose).
#                   Reachable by construction; model-agnostic.
# mode: absolute  → waypoints are world-frame poses (x, y, yaw), published as-is.
#
# <side>.waypoints is a flat list of [x, y, yaw] triples. Omit it to use the
# built-in default relative diamond (only valid in relative mode).

ee_target_publisher:
  ros__parameters:
    sides:         [left, right]
    mode:          relative      # relative | absolute

    # waypoints -- the loop below, on ee_setpoint
    # circle    -- a continuous circle, both arms, from each arm's start pose
    # rectangle -- a rectangle with SHARP corners at constant speed. The corners
    #              are deliberately infeasible: the NMPC has to decide what to
    #              give up, and with preview it turns early and cuts them.
    # teleop    -- each arm driven by velocity commands on
    #              /chaser/arm/<side>/ee_teleop (run ee_teleop_node in its own
    #              terminal), within the teleop block's limits below
    # circle/rectangle/teleop publish a sampled window on ee_trajectory, which
    # the NMPC follows with a per-node reference (nmpc.yaml's reference_preview),
    # and the current point on ee_setpoint. They need mode: relative.
    pattern:       waypoints     # waypoints | circle | rectangle | teleop
    trajectory_hz: 20.0          # how often a fresh window is sent [Hz]
    window_s:      2.0           # how far ahead each window reaches [s]; the
                                 # NMPC's horizon is ~1 s, so 2 s has margin
    sample_dt:     0.01          # window spacing [s]
    window_lookback_s: 0.1       # each window starts this far in the PAST [s]: the
                                 # NMPC evaluates it at its state's stamp, which is
                                 # always older than this node's clock
    approach_s:    3.0           # smooth move from the start pose onto the shape [s]
    circle:
      center_dx:   0.17          # [m] centre, offset from the start pose
      center_dy:   0.0
      radius:      0.06          # [m]
      period:      8.0           # [s] per lap
      ccw:         true
      ramp_s:      2.0           # [s] angular-rate ramp-in, so the circle is feasible
    rectangle:
      center_dx:   0.17          # [m] centre, offset from the start pose
      center_dy:   0.0
      width:       0.12          # [m] along world x
      height:      0.10          # [m] along world y
      speed:       0.055         # [m/s], constant. contact_bench measured the
                                 # NMPC still well ahead of the baselines up to
                                 # ~3x this; past ~4x its solves start to fail
      ccw:         true
    teleop:
      update_hz:     50.0        # [Hz] target update + window publish; a key
                                 # press reaches the NMPC within one tick
      cmd_timeout:   0.3         # [s] a command older than this counts as zero
                                 # (deadman: a dead teleop node stops the arms)
      max_lin_speed: 0.10        # [m/s] cap on the target's planar speed
      max_yaw_rate:  0.6         # [rad/s]
      max_lin_accel: 0.25        # [m/s^2] key press / release ramp
      max_yaw_accel: 2.0         # [rad/s^2]
      # The box the target stays in, as offsets from the start pose [m]. Like
      # the waypoint loop, it reaches out in +x, away from the bus; it must
      # contain the start pose (0, 0).
      dx_min:        0.0
      dx_max:        0.25
      dy_min:       -0.12
      dy_max:        0.12
      yaw_max:       0.3         # [rad] either side of the start orientation
    dwell_sec:     4.0           # hold each waypoint this long
    republish_hz:  2.0           # re-send the current target this often (DDS drop guard)
    loop:          true         # false → stop on the last waypoint
    frame_id:      map

    # Reach-out pattern: the start pose is folded in close to the bus, so
    # these offsets are biased almost entirely in +x (away from the bus,
    # in the arm's own extension direction) rather than symmetric about
    # home — a symmetric diamond would just fold it back in just as far
    # on its other half. Never returns closer than +0.10 to home.
    # (dx [m], dy [m], dyaw [rad]) triples.
    left:
      waypoints: [ 0.20,  0.00,  0.00,
                   0.25,  0.00,  0.00,
                   0.15, -0.12, -0.15,
                   0.15,  0.12,  0.15,
                   0.10,  0.00,  0.00 ]
    right:
      waypoints: [ 0.20,  0.00,  0.00,
                   0.15, -0.12, -0.15,
                   0.25,  0.00,  0.00,
                   0.15,  0.12,  0.15,
                   0.10,  0.00,  0.00 ]
    # left:
    #   waypoints: [ 0.20,  0.00,  0.00]

    # right:
    #   waypoints: [ 0.20,  0.00,  0.00]