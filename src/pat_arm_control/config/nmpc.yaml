# Constrained task-space NMPC arm controller (nmpc_node) — tuning parameters.
#
# Loaded AFTER arm_common.yaml, which holds what every control law shares (the
# model's joints and torque limits, safe-mode Tiers 2/3, the observer, realtime
# scheduling). This file holds the NMPC's own tuning in its /** block, and the
# per-arm blocks for its two node instances (pat_arm_nmpc_left / _right):
# ee_site_name, joint_names, owned_joints, per-joint limits and CPU pinning.
# Swap this whole file per scenario with the `params_file` launch arg.
#
# limits.* are parallel arrays: entry i belongs to that node's joint_names[i]
#   (this arm's 3 joints — NOT the model's 6).
# weights.* are 3-vectors [x, y, θz] for the planar task-space law.

# -------------------------------------------------------------------- #
# ------------------- ITERATIVE LINEARIZATION NMPC ------------------- #
# -------------------------------------------------------------------- #

# /**: # <--- wildcard: all nodes (that load this file) share these parameters 
#   ros__parameters:
#     nmpc:
#       Ts: 0.5                    # [s] horizon-step interval (not the sim dt)
#       N:  50                      # horizon steps. NOTE: VORTEX's own reference scenario
#                                   # for this model uses N=40, but that's tuned for the
#                                   # multi-shooting SQP path (re-linearizes every node) —
#                                   # this port only linearizes once at k=0, so doubling N
#                                   # just extrapolates further on a staler model. Tested
#                                   # N=40 here: max joint-limit slack ~4 vs ~0.4, qpsolve
#                                   # ~19ms vs ~6ms (eats the whole 50 Hz control period).
#                                   # Keep at 20 unless the SQP path gets ported.
      
#       full_nonlinear: false       # true ⇒ multiple-shooting SQP path. 
#       sqp_iters: 1
#       Hg_damping: 0.0001           # DLS damping for H_g inversion
#       tau_max: 1.0              # [N*m] global post-hoc torque clamp
#       rollout_v_clamp_mult: 2.0
#       terminal_velocity_constraint: true
#       terminal_cost_multiplier: 100.0

#     weights:
#       Q_pos:        [10.0,   10.0,   1.0   ]   # EE (x, y, θz) position error
#       Q_vel:        [ 1.0,    1.0,   3.0   ]   # EE (x, y, θz) velocity error. x/y stay
#                                                 # undamped (already well-behaved); θz is
#                                                 # damped because the wrist's rotational
#                                                 # inertia is much lower than its
#                                                 # translational one, so with Q_vel θz = 0
#                                                 # the yaw channel is far more lightly damped
#                                                 # than x/y at the same Q_pos/R — it visibly
#                                                 # oscillates (edot_th swinging +-2.5 rad/s
#                                                 # every tick even once e_th had converged)
#                                                 # while x/y track cleanly. Confirmed 2.0
#                                                 # tames it (edot_th mostly <0.7, several
#                                                 # near 0) without hurting x/y or slack.
#       R:            [  1.0e-2, 1.0e-2, 1.0e-1]  # task-space effort regularization
#       du_max_trans: [ 50.0,   50.0,   50.0  ]   # SQP trust region (full-nonlinear only)
#       du_max_rot:   [  5.0,    5.0,    5.0  ]   # SQP trust region (full-nonlinear only)

#     qp:
#       max_iter: 50
#       tol: 1.0e-6
#       reg_prim: 1.0e-6
#       warm_start: 2                    # 0 cold, 1 primal, 2 primal+dual
#       joint_slack_linear: 1.0e3
#       joint_slack_quadratic: 1.0e4
#       torque_slack_linear: 1.0e2
#       torque_slack_quadratic: 1.0e3

# pat_arm_nmpc_left:
#   ros__parameters:
#     arm_side: "left"
#     ee_site_name: "ee_site_L"
#     joint_names:  [joint2_L, joint3_L, joint5_L]
#     owned_joints: [joint2_L, joint3_L, joint5_L]
#     limits:
#       q_min:   [ 0.0,   -2.967, -1.22]   # [rad]  (servicer model joint ranges)
#       q_max:   [ 3.14,   0.0,    1.22]   # [rad]
#       qd_max:  [ 1.0,    1.0,    0.5 ]   # [rad/s], symmetric
#       tau_max: [ 0.25,   0.25,    0.25 ]   # [N*m], symmetric — matches MJCF motor ctrlrange

# pat_arm_nmpc_right:
#   ros__parameters:
#     arm_side: "right"
#     ee_site_name: "ee_site_R"
#     joint_names:  [joint2_R, joint3_R, joint5_R]
#     owned_joints: [joint2_R, joint3_R, joint5_R]
#     limits:
#       q_min:   [ 0.0,   -2.967, -1.22]
#       q_max:   [ 3.14,   0.0,    1.22]
#       qd_max:  [ 1.0,    1.0,    0.5 ]
#       tau_max: [ 0.25,    0.25,    0.25 ]

# ------------------------------------------------ #
# ------------------- SQP NMPC ------------------- #
# ------------------------------------------------ #

/**: # <--- wildcard: all nodes (that load this file) share these parameters
  ros__parameters:
    # Tier 1 of the graded failure response (Tiers 2 and 3 are arm_common.yaml's):
    # replay the last accepted plan, time-shifted. It exists because the solver
    # computes N stages and applies only the first, so one bad solve does not
    # mean there is nothing sensible left to do.
    safe_mode:
      # 5 ticks = 50 ms at 100 Hz. Sized for the transient, not the horizon: the
      # measured failures last one tick, and a replayed plan goes stale as the true
      # state leaves the one it was computed at. Raising it trades tracking error
      # for fewer Tier 2 entries. 0 disables Tier 1.
      #
      # How stale the plan goes depends on how far the setpoint moves. Today
      # ee_target_publisher steps between waypoints, which is the worst case for a
      # replayed plan; once a path planner feeds a smooth reference the plan stays
      # valid for longer and this can afford to be larger.
      tier1_max_replay_ticks: 5

    nmpc:
      Ts: 0.033
      N:  30
      
      full_nonlinear: true       
      sqp_iters: 1
      Hg_damping: 0.0001           # DLS damping for H_g inversion
      rollout_v_clamp_mult: 2.0
      # SQP trust region as a fraction of the reachable wrench (derived from
      # model_tau_max and the Jacobian, so it needs no absolute figure).
      du_max_frac: 1.0
      terminal_velocity_constraint: true
      terminal_cost_multiplier: 100.0
      # When following a reference trajectory (/chaser/arm/<side>/ee_trajectory),
      # score each horizon node against the reference at that node's own time,
      # so the optimiser sees the trajectory coming. false scores every node
      # against the reference now: a reactive baseline. No effect on a single
      # static setpoint, and none on the linearized path (it has no horizon).
      reference_preview: true

    weights:
      Q_pos:        [10.0,   10.0,   1.0   ]   
      Q_vel:        [ 1.0,    1.0,   3.0   ]   
      R:            [ 1.0e-1, 1.0e-1, 1.0e-1]  # task-space effort regularization

    qp:
      max_iter: 60
      tol: 1.0e-5
      reg_prim: 1.0e-6
      # 0 cold, 1 primal, 2 primal+dual. Primal-only: carrying the DUAL iterate
      # across a setpoint step makes it a bad guess, and HPIPM then runs to
      # max_iter (~0.9 ms/iteration) before the cold-start retry rescues it -- a
      # 141 ms worst-case tick, vs 34 ms here. See the README's warm-start table.
      warm_start: 1
      joint_slack_linear: 1.0e3
      joint_slack_quadratic: 1.0e4
      torque_slack_linear: 1.0e2
      torque_slack_quadratic: 1.0e3

      # Soft (penalised, above) vs hard (infeasible on violation). All three are
      # construction-time. Measured: soft recovers a joint parked 0.70 rad outside
      # its limit completely; hard+guard recovers 0.15 and leaves the box inactive;
      # hard torque lengthens the worst outage 10 -> 68 ticks. Keep all three as
      # they are unless you have new numbers -- README "Settled by measurement",
      # DISABLED_ConstraintStudy.Ladder regenerates them.
      # A soft BOX is what recovers a joint parked outside its limit -- the slack
      # IS the restoring mechanism, and no hard variant brings the joint all the
      # way back (README's "Constraint configuration").
      soft_joint_limits: true
      # Torque rows are HARD. Measured on current tuning, with a joint 0.70 rad
      # outside its limit for 300 ticks, hard torque is better or equal on every
      # column: same 96.7% availability, same 10-tick worst outage, same full
      # recovery, less time outside (0.353 vs 0.372 rad*s), a 2.7x faster mean
      # tick, 7.5x fewer deadline overruns and 12x fewer NaN solves (5 vs 60).
      # Nominal and aggressive-setpoint runs are indistinguishable.
      #
      # It also matters for the Jetson. Soft torque rows are the fragile group in
      # HPIPM near infeasibility, and HOW fragile depends on the BLAS kernels: on
      # aarch64 the soft/soft combination collapsed to 21.7% availability with 240
      # NaN solves in 300 and never fully recovered the joint, where hard torque
      # gives 96.7% and full recovery, matching x86 exactly. Regularisation does
      # not rescue soft/soft -- a reg_prim x torque-slack sweep on aarch64 peaked
      # at 58% and was non-monotonic, i.e. scatter rather than a tunable optimum
      # (DISABLED_RegularisationStudy).
      soft_torque_limits: false
      relax_box_to_contain_x0: false   # hard box only; with a soft box it weakens
      relax_box_margin: 1.0e-3         #   the slack that does the restoring

pat_arm_nmpc_left:
  ros__parameters:
    arm_side: "left"
    # Fast cores for this arm only, so the two arms never share one.
    # `lscpu -e=CPU,CORE,MAXMHZ` identifies them: on the reference box CPUs 0-11
    # are P-cores and 12-19 E-cores. Left commented out rather than set to []
    # because an empty YAML list has no inferable element type, so ROS cannot set
    # the parameter at all and the node fails to construct; unset means the C++
    # default, an empty mask, which leaves placement to the kernel.
    # rt_cpus: [4, 5]      # one physical P-core's SMT pair
    # rt_cpus_observer: [8, 9]   # a DIFFERENT pair from rt_cpus above
    ee_site_name: "ee_site_L"
    joint_names:  [joint2_L, joint3_L, joint5_L]
    owned_joints: [joint2_L, joint3_L, joint5_L]
    limits:
      # A software margin 0.05 rad inside the MJCF ranges ([0, 3.14],
      # [-2.967, 0], [-1.22, 1.22]); may only TIGHTEN them, the intersection is
      # taken. The margin is the point -- set equal to the MJCF ranges the box
      # constrains nothing MuJoCo does not already enforce mechanically.
      q_min:   [ 0.05,  -2.917, -1.17 ]   # [rad]
      q_max:   [ 3.09,  -0.05,   1.17 ]   # [rad]
      qd_max:  [ 2.0,    2.0,    1.50 ]   # [rad/s], symmetric

pat_arm_nmpc_right:
  ros__parameters:
    arm_side: "right"
    # rt_cpus: [6, 7]      # see the left arm's note
    # rt_cpus_observer: [10, 11]  # see the left arm's note
    ee_site_name: "ee_site_R"
    joint_names:  [joint2_R, joint3_R, joint5_R]
    owned_joints: [joint2_R, joint3_R, joint5_R]
    limits:
      q_min:   [ 0.05,  -2.917, -1.17 ]   # see the left arm's note above
      q_max:   [ 3.09,  -0.05,   1.17 ]
      qd_max:  [ 2.0,    2.0,    1.50 ]
