services:
  dev:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
      args:
        MUJOCO_VERSION: "3.7.0"
        ACADOS_REF: "v0.4.2"
    image: mujoco-pat:dev
    container_name: mujoco_pat_dev
    # Run as your host user so bind-mounted files keep your ownership.
    # UID/GID come from .env (edit it if `id -u` isn't 1000).
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /ws
    environment:
      - DISPLAY=${DISPLAY}                 # MuJoCo GLFW viewer / rviz
      - MAKEFLAGS=-j${BUILD_JOBS:-2}       # keep colcon compiles off the OOM line
      # GPU-accelerated GLX for the MuJoCo viewer (was falling back to Mesa
      # llvmpipe software rendering, badly slow once real CAD meshes were
      # added) - both vars are needed for nvidia-container-toolkit to inject
      # the host driver's GL libraries, not just CUDA/compute.
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      # Whole repo bind-mounted; colcon builds into ./build + ./install on the
      # host (gitignored), same as VORTEX builds into /workspace. acados + MuJoCo
      # are baked into the image at /opt — no writable-deps volume needed.
      - ./:/ws
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    # /dev/dri: the actual fix for MuJoCo viewer GLX performance on THIS host -
    # its X server (DISPLAY, forwarded above) runs on the Intel iGPU, not the
    # NVIDIA card below (a hybrid/Optimus laptop: NVIDIA is compute/offload-
    # only here, not what serves GLX to X11 clients) - without this device,
    # Mesa falls back to llvmpipe software rendering inside the container.
    # group_add uses numeric GIDs (not names) so they match the HOST's
    # video/render group ownership of /dev/dri/* regardless of what GIDs
    # those group names resolve to inside the container image.
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "44"   # video (host GID - `getent group video`)
      - "110"  # render (host GID - `getent group render`)
    # Realtime scheduling for pat_arm_nmpc's control thread. These are RLIMITS,
    # deliberately NOT cap_add: [SYS_NICE] - `user:` above runs the container as a
    # non-root user, which has an empty effective capability set (CapEff: 0), and
    # a capability added to the bounding set is not granted to a non-root process
    # without ambient capabilities. cap_add here would look like it worked and do
    # nothing.
    #
    # RLIMIT_RTPRIO is the mechanism that does work unprivileged: it lets any
    # process request SCHED_FIFO/SCHED_RR up to this priority with no capability
    # at all. CAP_SYS_NICE is only needed to exceed the rlimit, to renice
    # negatively, or to change another process's policy - none of which this needs.
    #
    # memlock is for mlockall, so a page fault cannot stall a control tick. The
    # number has to clear arm_nmpc_node's VIRTUAL size (~750 MB), not its ~33 MB
    # resident set: the kernel admits an MCL_CURRENT mlockall by comparing
    # RLIMIT_MEMLOCK against the process's total_vm, and it does that even with
    # MCL_ONFAULT, which only changes how much memory ends up locked afterwards.
    # So this is an admission threshold, not a reservation - with ONFAULT the node
    # actually pins about its resident set, and /proc/meminfo's Mlocked shows ~45 MB
    # for both arms together. Check Mlocked, not the process's VmLck: that counts
    # the VMAs MARKED for locking, which with ONFAULT is the whole address space
    # and reads as ~700 MB per node.
    # Finite rather than unlimited because this box has a history of systemd-oomd
    # killing the desktop session under memory pressure; if VmSize ever grows past
    # this, mlockall fails and the node says so on its first report.
    ulimits:
      rtprio: 99
      memlock: 1073741824
    # ROS 2 DDS shared-memory discovery needs all three, or `ros2 node list`
    # comes up empty and `ros2 topic hz` segfaults across shells.
    network_mode: host
    ipc: host
    pid: host
    tty: true
    stdin_open: true
    # Standard Compose GPU-reservation syntax - the same nvidia-container-
    # toolkit mechanism Jetson's own default "nvidia" docker runtime uses,
    # so this should carry over to a Jetson-side compose service later
    # (untested on real Jetson hardware - the driver stack it resolves to
    # differs, but the request syntax doesn't need to change). Not what fixes
    # the viewer on this particular host (see /dev/dri above) - kept for any
    # future CUDA/compute use, harmless if unused.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
